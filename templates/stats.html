{% extends "base.html" %}
{% block title %}Stats · Chess Review{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>My stats</h1>
    <div class="sub" id="stats-who"></div>
  </div>
  <span class="spacer"></span>
  <div class="slicers">
    <label>Games
      <select id="count" aria-label="Number of games">
        <option value="10">Last 10</option><option value="20" selected>Last 20</option>
        <option value="30">Last 30</option><option value="50">Last 50</option>
      </select>
    </label>
    <label>Analysis level
      <select id="level" aria-label="Analysis level"></select>
    </label>
    <label title="How much of the CPU the engine may use: more effort, faster analysis">Effort
      <select id="effort" aria-label="Effort"></select>
    </label>
  </div>
</div>
<div id="stats-error" class="error-box" hidden></div>
<div>
  <div class="notice" id="batch" hidden>
    <div class="grow">
      <div id="batch-text"></div>
      <div class="progress" id="batch-progress" hidden><div class="progress-fill" id="batch-fill"></div></div>
      <div class="muted" id="batch-label" style="font-size:13px"></div>
    </div>
    <button class="btn btn-primary" id="batch-start"></button>
    <button class="btn btn-danger" id="batch-stop" hidden>Stop analysis</button>
  </div>
</div>

<div id="stats-body" hidden>
  <div class="tiles" id="tiles"></div>
  <div class="stats-grid">
    <section class="card wide">
      <div class="section-title">Accuracy per game (oldest → newest)</div>
      <div class="trend-chart"><canvas id="trend" aria-label="Accuracy per game"></canvas></div>
    </section>
    <section class="card">
      <div class="section-title">Openings where I lose the most</div>
      <div class="table-scroll" id="openings"></div>
    </section>
    <section class="card">
      <div class="section-title">Errors under time pressure</div>
      <div id="pressure"></div>
      <div class="section-title" style="margin-top:20px">My moves by classification</div>
      <div id="totals"></div>
    </section>
    <section class="card wide">
      <div class="section-title">Games</div>
      <div class="table-scroll" id="game-list"></div>
    </section>
  </div>
</div>
<div id="stats-empty" class="empty" hidden></div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='vendor/chart.umd.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/stats.js') }}"></script>
{% endblock %}
